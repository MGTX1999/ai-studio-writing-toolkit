<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>叙事工作台 · 本地编辑器</title>
<meta name="description" content="叙事工作台：长篇、同人、剧本与广播剧的本地创作工作台，含合规预检、OOC 检查、角色会诊与妙招。">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#view">跳到正文</a>
<header class="topbar">
  <button id="nav-toggle" class="nav-toggle" type="button" aria-label="打开导航" aria-expanded="false" aria-controls="nav">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#/projects">
    <span class="brand-title">叙事工作台</span>
    <span class="brand-sub">本地创作工作台 · 副驾模式</span>
  </a>
  <div class="topbar-actions">
    <div id="project-switch" class="project-switch" hidden>
      <button id="project-badge" class="project-badge" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="切换项目"></button>
      <div id="project-menu" class="project-menu" role="menu" aria-label="项目列表" hidden></div>
    </div>
    <div id="next-action" class="next-action" hidden></div>
    <button id="theme-toggle" class="btn btn-small theme-toggle" type="button" aria-label="切换到夜间主题" aria-pressed="false" title="切换日间 / 夜间主题">
      <svg class="theme-icon theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8Z"/></svg>
      <svg class="theme-icon theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button id="command-btn" class="btn btn-small command-btn" type="button" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K">命令 <kbd>⌘K</kbd></button>
  </div>
</header>
<div class="shell">
  <nav id="nav" class="nav" aria-label="主导航"></nav>
  <main id="view" class="view" tabindex="-1"></main>
</div>
<div id="nav-backdrop" class="nav-backdrop" hidden></div>
<div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="modal-root"></div>
<script src="app.js"></script>
</body>
</html>
