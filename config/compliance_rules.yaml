# 叙事工作台 · 通用合规规则（v3）
# 只做风险提示，不替代平台审核；不提供规避审核的方法。
# 词表可由作者按目标平台替换，规则文件缺失时引擎仍可运行。

version: 3
name: 通用叙事合规规则
disclaimer: 本规则只做风险提示，不替代平台审核；命中后请人工复核并改写。

word_layer:
  red_words: []
  yellow_words: [傻逼, 操你妈, 贱人, 婊子, 去死, 死全家]
  platform_words: [本站, 笔趣阁, 番茄, 晋江, 起点, 签约编辑, 内投, 编辑QQ]

semantic_layer:
  generalization_terms: [所有人, 所有人都, 全都, 无一例外, 一律, 凡是, 这类人, 那些人, 这种群体]
  dehumanizing_terms: [害虫, 病毒, 垃圾, 废物, 蛆虫, 畜生, 蝼蚁, 寄生虫]
  polarity_terms: [镇压, 清算, 消灭, 赶尽杀绝, 彻底清除, 一个不留]
  real_anchor_patterns: ['20\d{2}年', '\d{1,2}月\d{1,2}日', '某市', '某省', '某县', '某医院', '某学校', '某公司', '某单位']

event_layer:
  group_subjects: [人们, 众人, 大家, 群体, 全体, 所有人, 员工, 学生, 工人, 医生, 护士, 教师, 职员, 居民, 村民]
  collective_actions: [罢工, 罢课, 怠工, 联名, 串联, 请愿, 抗议, 静坐, 集体请假, 统一行动, 集体辞职, 集体维权]
  scale_markers: [集体, 全体, 统一, 联合, 组织, 同时, 约定, 大规模, 全部, 一起]
  organization_markers: [群聊, 群组, 召集, 组织者, 代表, 约定时间, 分工, 接龙]
  min_hits: 2

alternatives:
  general: [把宏大冲突收回到一个具体人物的处境与选择, 用个体后果替代群体标签, 虚化现实指向并改为架空设定, 保留冲突但删掉组织方式与规模描写]
  dehumanizing: [改为具体行为描述而不用物种化比喻, 让被指责者拥有姓名与动机, 用角色的判断代替叙述者的判决]
  event: [改为单个角色的遭遇而不写群体行动, 把集体冲突写成主角的个人困境, 删去组织、串联、规模等细节]

ai_phrases: [不由得, 不由自主, 仿佛, 空气仿佛凝固, 心中一凛, 嘴角勾起, 眼底闪过一丝, 不易察觉, 意味深长]
